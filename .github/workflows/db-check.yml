name: DB Check

# Diagnostic: quantify storage usage behind the exceed_storage_size_quota
# suspension (management API still works while REST/auth are 402-blocked).

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Inspect
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          q() {
            curl -s -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SAT" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$1" '{query:$q}')"
          }
          echo "=== database size ==="
          q "select pg_size_pretty(pg_database_size(current_database())) as db_size;"
          echo
          echo "=== file storage per bucket ==="
          q "select bucket_id, count(*) as files, pg_size_pretty(sum(coalesce((metadata->>'size')::bigint,0))) as total, sum(coalesce((metadata->>'size')::bigint,0)) as bytes from storage.objects group by bucket_id order by bytes desc;"
          echo
          echo "=== total file storage ==="
          q "select pg_size_pretty(sum(coalesce((metadata->>'size')::bigint,0))) as total_files from storage.objects;"
          echo
          echo "=== biggest tables ==="
          q "select relname, pg_size_pretty(pg_total_relation_size(c.oid)) as size from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname='public' and c.relkind='r' order by pg_total_relation_size(c.oid) desc limit 8;"
