name: DB Check

# Diagnostic: reproduce the HR 201-files render as an authenticated user that
# sees the full staff list (like the owner), and analyze the response body.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Inspect
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          URL="https://$REF.supabase.co"
          APP="https://futex-web-app.vercel.app"
          SERVICE=$(curl -s "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[]|select(.name=="service_role")|.api_key) else empty end')
          ANON=$(curl -s "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[]|select(.name=="anon")|.api_key) else empty end')

          fetch_as () {  # $1 = role
            local ROLE="$1"
            local TS EMAIL PASS CREATE PUID TOK SESSION NAME B64 VAL LEN
            TS=$(date +%s%N)
            EMAIL="diag-$ROLE-$TS@example.com"
            PASS="Probe-$TS-Aa1!"
            CREATE=$(curl -s -X POST "$URL/auth/v1/admin/users" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"email_confirm\":true}")
            PUID=$(echo "$CREATE" | jq -r '.id // .user.id // empty')
            curl -s -X POST "$URL/rest/v1/profiles" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" -d "{\"id\":\"$PUID\",\"full_name\":\"Diag $ROLE\",\"role\":\"$ROLE\",\"active\":true}" -o /dev/null
            TOK=$(curl -s -X POST "$URL/auth/v1/token?grant_type=password" -H "apikey: $ANON" -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}")
            SESSION=$(echo "$TOK" | jq -c '.')
            NAME="sb-$REF-auth-token"
            B64=$(printf '%s' "$SESSION" | base64 -w0 | tr '+/' '-_' | tr -d '=')
            VAL="base64-$B64"
            LEN=${#VAL}
            COOKIE_ARGS=()
            if [ $LEN -le 3600 ]; then
              COOKIE_ARGS=(-b "$NAME=$VAL")
            else
              local off=0 i=0
              while [ $off -lt $LEN ]; do
                COOKIE_ARGS+=(-b "$NAME.$i=${VAL:$off:3600}")
                off=$((off+3600)); i=$((i+1))
              done
            fi
            echo "======== role=$ROLE uid=$PUID ========"
            code=$(curl -s "${COOKIE_ARGS[@]}" -o /tmp/body -w '%{http_code}' "$APP/hr/201-files")
            echo "  HTTP $code  body_bytes=$(wc -c </tmp/body)"
            echo "  digest: $(grep -oE 'Digest[^<\"]*' /tmp/body | head -1)"
            echo "  contains 'No registered field staff': $(grep -c 'No registered field staff' /tmp/body)"
            echo "  contains 'Sarin'(employee): $(grep -c 'Sarin' /tmp/body)"
            echo "  contains 'server-side exception': $(grep -c 'server-side exception' /tmp/body)"
            echo "  contains '201 Files'(header): $(grep -c '201 Files' /tmp/body)"
            curl -s -X DELETE "$URL/auth/v1/admin/users/$PUID" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -o /dev/null
          }

          fetch_as owner
          fetch_as hr
          fetch_as admin
