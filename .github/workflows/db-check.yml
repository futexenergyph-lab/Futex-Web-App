name: DB Check

# Diagnostic: dump the exact attendance query AttendanceReport runs, to find
# the row/shape that crashes the render.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Inspect
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          URL="https://$REF.supabase.co"
          SERVICE=$(curl -s "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[]|select(.name=="service_role")|.api_key) else empty end')

          echo "=== exact attendance query (embed profiles) — HTTP + first rows ==="
          curl -s -G -w $'\nHTTP %{http_code}\n' "$URL/rest/v1/attendance" \
            --data-urlencode "select=id,user_id,type,timestamp,photo_url,lat,lng,profiles(full_name,role)" \
            --data-urlencode "order=timestamp.asc" \
            --data-urlencode "limit=3" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" | head -c 2500
          echo

          echo "=== total attendance rows ==="
          curl -s -G -w $'\nHTTP %{http_code}\n' "$URL/rest/v1/attendance" \
            --data-urlencode "select=id" -H "Prefer: count=exact" \
            --data-urlencode "limit=1" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -D - -o /dev/null | grep -i "content-range"

          echo "=== distinct lat/lng JSON types (scan up to 500) ==="
          curl -s -G "$URL/rest/v1/attendance" \
            --data-urlencode "select=lat,lng" --data-urlencode "limit=500" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" \
            | jq -r '[.[].lat|type] | unique | "lat types: \(.)"' 2>/dev/null
          curl -s -G "$URL/rest/v1/attendance" \
            --data-urlencode "select=lat,lng" --data-urlencode "limit=500" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" \
            | jq -r '[.[].lng|type] | unique | "lng types: \(.)"' 2>/dev/null

          echo "=== rows where profiles embed is null (orphaned user_id) ==="
          curl -s -G "$URL/rest/v1/attendance" \
            --data-urlencode "select=id,user_id,type,timestamp,profiles(full_name,role)" \
            --data-urlencode "limit=500" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" \
            | jq -r '[.[]|select(.profiles==null)] | "null-profiles rows: \(length)"' 2>/dev/null

          echo "=== distinct profiles.role values present in attendance embed ==="
          curl -s -G "$URL/rest/v1/attendance" \
            --data-urlencode "select=profiles(role)" --data-urlencode "limit=500" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" \
            | jq -r '[.[].profiles.role] | unique | "roles: \(.)"' 2>/dev/null

          echo "=== timestamp null check ==="
          curl -s -G "$URL/rest/v1/attendance" \
            --data-urlencode "select=id,timestamp" --data-urlencode "timestamp=is.null" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" | head -c 400
          echo
