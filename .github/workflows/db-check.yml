name: DB Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: List accounts
        run: |
          set -e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          Q="select u.email, p.full_name, p.role, p.active, to_char(u.last_sign_in_at,'YYYY-MM-DD') as last_login from public.profiles p join auth.users u on u.id = p.id order by p.role, p.full_name;"
          jq -nc --arg q "$Q" '{query:$q}' > /tmp/payload.json
          curl -s "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SAT" -H "Content-Type: application/json" \
            --data-binary @/tmp/payload.json | jq -r '.[] | [.email, .full_name, .role, (if .active then "active" else "DISABLED" end), (.last_login // "never")] | @tsv'
