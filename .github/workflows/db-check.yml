name: DB Check

# Read-only: clients installed Aug 1 - Sep 6 2026 whose job order includes
# a metal stand (in the package name or the additional job works).

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Inspect
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          echo "project ref: $REF"
          run_sql() {
            local RESP
            RESP=$(curl -s -w $'\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SAT" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$1" '{query:$q}')")
            echo "HTTP $(echo "$RESP" | tail -n1)"
            echo "$RESP" | sed '$d' | head -c 4000; echo
          }

          echo "== Clients Aug 1 - Sep 6 with a metal stand on the job order =="
          run_sql "with jo as (select distinct on (booking_id) booking_id, package_id, additional_job_works from public.job_orders order by booking_id, created_at desc) select b.preferred_date, b.client_name, p.name as package, (select string_agg(w->>'description', ' | ') from jsonb_array_elements(coalesce(jo.additional_job_works, '[]'::jsonb)) w where lower(w->>'description') like '%stand%') as stand_job_works from public.bookings b join jo on jo.booking_id = b.id left join public.packages p on p.id = jo.package_id where b.preferred_date between '2026-08-01' and '2026-09-06' and (lower(coalesce(p.name, '')) ~ '\\mstand\\M' or exists (select 1 from jsonb_array_elements(coalesce(jo.additional_job_works, '[]'::jsonb)) w where lower(w->>'description') like '%stand%')) order by b.preferred_date;"
