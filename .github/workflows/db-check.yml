name: DB Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VT: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Show Vercel plan
        run: |
          set -e
          echo "=== user ==="
          curl -s https://api.vercel.com/v2/user -H "Authorization: Bearer $VT" | jq '{username: .user.username, name: .user.name, plan: .user.billing.plan, period: .user.billing.period}' || true
          echo "=== teams ==="
          curl -s "https://api.vercel.com/v2/teams" -H "Authorization: Bearer $VT" | jq -r '.teams[]? | {name, slug, plan: .billing.plan}' || true
