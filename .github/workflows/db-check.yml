name: DB Check

# One-off: remove ALL field-officer expense reflections dated before Sep 6
# 2026 from client_financials (reflection applies to new submissions only).

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Cleanup
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          echo "project ref: $REF"
          run_sql() {
            local SQL="$1"
            local RESP
            RESP=$(curl -s -w $'\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SAT" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$SQL" '{query:$q}')")
            echo "HTTP $(echo "$RESP" | tail -n1)"
            echo "$RESP" | sed '$d' | head -c 1500; echo
          }

          echo "== BEFORE: reflection copies dated before Sep 6 =="
          run_sql "select count(*) as reflections_before_sep6, min(entry_date) as earliest, max(entry_date) as latest from public.client_financials where source_expense_id is not null and (entry_date is null or entry_date < '2026-09-06');"
          run_sql "select count(*) as total_all from public.client_financials;"

          echo "== DELETE =="
          run_sql "delete from public.client_financials where source_expense_id is not null and (entry_date is null or entry_date < '2026-09-06');"

          echo "== AFTER =="
          run_sql "select count(*) as remaining_old_reflections from public.client_financials where source_expense_id is not null and (entry_date is null or entry_date < '2026-09-06');"
          run_sql "select count(*) as total_all from public.client_financials;"
