name: DB Check

# One-off cleanup: remove Internal Inputs expense lines (client_financials)
# dated Aug 1 - Sep 5 2026 (plus undated lines created in that window).
# The owner will re-enter them manually. Accounting expenses are untouched.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Cleanup
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          echo "project ref: $REF"
          run_sql() {
            local SQL="$1"
            local RESP
            RESP=$(curl -s -w $'\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SAT" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$SQL" '{query:$q}')")
            echo "HTTP $(echo "$RESP" | tail -n1)"
            echo "$RESP" | sed '$d' | head -c 1500; echo
          }

          echo "== BEFORE: rows in the removal window =="
          run_sql "select count(*) as dated from public.client_financials where entry_date >= '2026-08-01' and entry_date <= '2026-09-05';"
          run_sql "select count(*) as undated_created_in_window from public.client_financials where entry_date is null and created_at >= timestamptz '2026-08-01 00:00:00+08' and created_at < timestamptz '2026-09-06 00:00:00+08';"
          run_sql "select count(*) as total_all from public.client_financials;"

          echo "== DELETE =="
          run_sql "delete from public.client_financials where (entry_date >= '2026-08-01' and entry_date <= '2026-09-05') or (entry_date is null and created_at >= timestamptz '2026-08-01 00:00:00+08' and created_at < timestamptz '2026-09-06 00:00:00+08');"

          echo "== AFTER =="
          run_sql "select count(*) as remaining_in_window from public.client_financials where (entry_date >= '2026-08-01' and entry_date <= '2026-09-05') or (entry_date is null and created_at >= timestamptz '2026-08-01 00:00:00+08' and created_at < timestamptz '2026-09-06 00:00:00+08');"
          run_sql "select count(*) as total_all from public.client_financials;"
