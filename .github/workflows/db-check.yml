name: DB Check

# Diagnostic: report the Supabase project region (for latency/perf tuning).

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Inspect
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          echo "project ref: $REF"
          echo "=== project region ==="
          curl -s "https://api.supabase.com/v1/projects/$REF" -H "Authorization: Bearer $SAT" | jq -r '{name, region, created_at}' 2>/dev/null
