name: DB Check

# One-off (owner request): delete the TEST client "Jeffrey Lois Talla" and
# every record tied to that booking (job orders, payments, expenses,
# internal expense lines, updates, documents).

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Remove test client
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          echo "project ref: $REF"
          run_sql() {
            local RESP
            RESP=$(curl -s -w $'\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SAT" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$1" '{query:$q}')")
            echo "HTTP $(echo "$RESP" | tail -n1)"
            echo "$RESP" | sed '$d' | head -c 2000; echo
          }

          T="select id from public.bookings where client_name ilike 'Jeffrey Lois Talla'"

          echo "== BEFORE: the test client bookings =="
          run_sql "select id, client_name, client_number, status, preferred_date from public.bookings where client_name ilike 'Jeffrey Lois Talla';"
          echo "== Related record counts =="
          run_sql "select (select count(*) from public.job_orders where booking_id in ($T)) as job_orders, (select count(*) from public.payments where booking_id in ($T)) as payments, (select count(*) from public.expenses where booking_id in ($T)) as expenses, (select count(*) from public.client_financials where booking_id in ($T)) as internal_lines, (select count(*) from public.client_financial_status where booking_id in ($T)) as final_status, (select count(*) from public.job_updates where booking_id in ($T)) as updates, (select count(*) from public.documentation where booking_id in ($T)) as documentation, (select count(*) from public.booking_documents where booking_id in ($T)) as documents;"

          echo "== DELETE (tables without cascade first, then the booking) =="
          run_sql "delete from public.client_financials where booking_id in ($T);"
          run_sql "delete from public.client_financial_status where booking_id in ($T);"
          run_sql "delete from public.expenses where booking_id in ($T);"
          run_sql "delete from public.bookings where client_name ilike 'Jeffrey Lois Talla';"

          echo "== AFTER: verify all gone =="
          run_sql "select (select count(*) from public.bookings where client_name ilike 'Jeffrey Lois Talla') as bookings, (select count(*) from public.client_financials where booking_id in ($T)) as internal_lines, (select count(*) from public.expenses where booking_id in ($T)) as expenses;"
