name: DB Check

# Diagnostic: inspects the Supabase schema and runs the exact queries the
# dashboard uses, printing results so we can see what's failing.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Inspect
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          echo "project ref: $REF"
          URL="https://$REF.supabase.co"
          SERVICE=$(curl -s "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[]|select(.name=="service_role")|.api_key) else empty end')

          echo "============================================================"
          echo "1) Tables exposed by PostgREST:"
          curl -s "$URL/rest/v1/" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" \
            | jq -r '(.definitions // {}) | keys[]' 2>/dev/null | sort | tr '\n' ' '
          echo

          echo "============================================================"
          echo "2) profiles row count + sample:"
          curl -s "$URL/rest/v1/profiles?select=id,full_name,role,active&limit=5" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" | head -c 800
          echo

          echo "============================================================"
          echo "3) bookings simple select (HTTP + body):"
          curl -s -w $'\nHTTP %{http_code}\n' "$URL/rest/v1/bookings?select=*&limit=1" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" | head -c 800
          echo

          echo "============================================================"
          echo "4) bookings EMBED select (the dashboard query):"
          SEL='*,preferred_package:packages!bookings_preferred_package_id_fkey(id,name,base_price),preferred_enclosure:enclosures!bookings_preferred_enclosure_id_fkey(id,name,price),assigned_field_officer:profiles!bookings_assigned_field_officer_id_fkey(id,full_name),assigned_installer:profiles!bookings_assigned_installer_id_fkey(id,full_name)'
          curl -s -G -w $'\nHTTP %{http_code}\n' "$URL/rest/v1/bookings" \
            --data-urlencode "select=$SEL" --data-urlencode "limit=1" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" | head -c 1200
          echo

          echo "============================================================"
          echo "5) packages / enclosures counts:"
          for t in packages enclosures addons settings job_orders payments; do
            C=$(curl -s -w '%{http_code}' -o /tmp/b "$URL/rest/v1/$t?select=*&limit=1" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE")
            echo "  $t -> HTTP $C  $(head -c 120 /tmp/b)"
          done

          echo "============================================================"
          echo "6) HR 201-files: exact page queries"
          echo "-- profiles role filter (field_officer/installer):"
          curl -s -G -w $'\nHTTP %{http_code}\n' "$URL/rest/v1/profiles" \
            --data-urlencode "select=id,full_name,role,phone" \
            --data-urlencode "role=in.(field_officer,installer)" \
            --data-urlencode "order=full_name" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" | head -c 1500
          echo
          echo "-- personal_data_sheets (user_id, photo_url, data):"
          curl -s -G -w $'\nHTTP %{http_code}\n' "$URL/rest/v1/personal_data_sheets" \
            --data-urlencode "select=user_id,photo_url,data" \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" | head -c 2000
          echo
          echo "-- is_hr / is_admin functions present:"
          curl -s -w $'\nHTTP %{http_code}\n' "$URL/rest/v1/rpc/is_hr" -X POST \
            -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" \
            -H "Content-Type: application/json" -d '{}' | head -c 300
          echo

          echo "============================================================"
          echo "7) Production page fetch (unauth) — does the route module load?"
          APP="https://futex-web-app.vercel.app"
          for p in /hr/201-files /hr /admin /login; do
            code=$(curl -s -o /tmp/pg -w '%{http_code}' "$APP$p")
            loc=$(curl -s -o /dev/null -w '%{redirect_url}' "$APP$p")
            dig=$(grep -oE 'Digest[^<]*' /tmp/pg | head -1)
            echo "  $p -> HTTP $code  redirect=$loc  $dig"
          done

          echo "============================================================"
          echo "8) Authenticated render test (temp admin user, cleaned up after)"
          ANON=$(curl -s "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[]|select(.name=="anon")|.api_key) else empty end')
          TS=$(date +%s)
          EMAIL="diag-probe-$TS@example.com"
          PASS="Probe-$TS-Aa1!"
          CREATE=$(curl -s -X POST "$URL/auth/v1/admin/users" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"email_confirm\":true}")
          PUID=$(echo "$CREATE" | jq -r '.id // .user.id // empty')
          echo "  created uid: $PUID"
          # ensure an admin profile row exists (trigger may create one; upsert to be safe)
          curl -s -X POST "$URL/rest/v1/profiles" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" -d "{\"id\":\"$PUID\",\"full_name\":\"Diag Probe\",\"role\":\"admin\",\"active\":true}" -o /dev/null -w '  profile upsert HTTP %{http_code}\n'
          TOK=$(curl -s -X POST "$URL/auth/v1/token?grant_type=password" -H "apikey: $ANON" -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}")
          SESSION=$(echo "$TOK" | jq -c '.')
          HASTOK=$(echo "$SESSION" | jq -r 'has("access_token")')
          echo "  signed in (has access_token: $HASTOK)"
          NAME="sb-$REF-auth-token"
          B64=$(printf '%s' "$SESSION" | base64 -w0 | tr '+/' '-_' | tr -d '=')
          VAL="base64-$B64"
          LEN=${#VAL}
          COOKIE_ARGS=()
          if [ $LEN -le 3600 ]; then
            COOKIE_ARGS+=(-b "$NAME=$VAL")
          else
            off=0; i=0
            while [ $off -lt $LEN ]; do
              COOKIE_ARGS+=(-b "$NAME.$i=${VAL:$off:3600}")
              off=$((off+3600)); i=$((i+1))
            done
            echo "  (chunked session cookie into $i parts, len=$LEN)"
          fi
          echo "  -- control: /admin should be 200 if cookie valid --"
          curl -s "${COOKIE_ARGS[@]}" -o /tmp/adm -w '  /admin HTTP %{http_code}\n' "$APP/admin"
          echo "  -- target: /hr/201-files --"
          curl -s "${COOKIE_ARGS[@]}" -o /tmp/hr -w '  /hr/201-files HTTP %{http_code}\n' "$APP/hr/201-files"
          echo "  digest: $(grep -oE 'Digest[^<\"]*' /tmp/hr | head -1)"
          echo "  body(first 400): $(head -c 400 /tmp/hr | tr -d '\n')"
          curl -s -X DELETE "$URL/auth/v1/admin/users/$PUID" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -o /dev/null -w '  cleanup delete user HTTP %{http_code}\n'
