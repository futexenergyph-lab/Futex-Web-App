name: DB Check

# One-off: encode Jul 3 2026 field officer expenses into Internal Inputs.
# Each officer's Jul 3 expenses go to ONE of their Jul 3 clients (no doubling).

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Encode
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          echo "project ref: $REF"
          run_sql() {
            local RESP
            RESP=$(curl -s -w $'\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SAT" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$1" '{query:$q}')")
            echo "HTTP $(echo "$RESP" | tail -n1)"
            echo "$RESP" | sed '$d' | head -c 2500; echo
          }

          echo "== PLAN: per-officer target client + expense totals for Jul 3 =="
          run_sql "with tgt as (select distinct on (b.assigned_field_officer_id) b.assigned_field_officer_id as officer, b.id as booking_id, b.client_name from public.bookings b where b.preferred_date = '2026-07-03' and b.assigned_field_officer_id is not null order by b.assigned_field_officer_id, (b.status = 'completed') desc, b.client_number nulls last, b.created_at) select p.full_name as officer, t.client_name as target_client, count(e.id) as expense_lines, coalesce(sum(e.amount),0) as total from public.expenses e join public.profiles p on p.id = e.created_by and p.role = 'field_officer' join tgt t on t.officer = e.created_by where e.expense_date = '2026-07-03' and e.status <> 'draft' group by p.full_name, t.client_name order by p.full_name;"

          echo "== Jul 3 FO expenses with NO Jul 3 assignment (will be skipped) =="
          run_sql "select p.full_name, count(*) as lines, coalesce(sum(e.amount),0) as total from public.expenses e join public.profiles p on p.id = e.created_by and p.role = 'field_officer' where e.expense_date = '2026-07-03' and e.status <> 'draft' and e.created_by not in (select assigned_field_officer_id from public.bookings where preferred_date = '2026-07-03' and assigned_field_officer_id is not null) group by p.full_name;"

          echo "== INSERT =="
          run_sql "with tgt as (select distinct on (b.assigned_field_officer_id) b.assigned_field_officer_id as officer, b.id as booking_id from public.bookings b where b.preferred_date = '2026-07-03' and b.assigned_field_officer_id is not null order by b.assigned_field_officer_id, (b.status = 'completed') desc, b.client_number nulls last, b.created_at) insert into public.client_financials (booking_id, entry_date, project_name, expense_type, description, amount, charge_to, remarks, created_by, created_by_name, source_expense_id) select t.booking_id, e.expense_date, null, public.expense_type_label(e.type), coalesce(e.description, ''), e.amount, null, 'Field officer expense — ' || p.full_name, e.created_by, p.full_name, e.id from public.expenses e join public.profiles p on p.id = e.created_by and p.role = 'field_officer' join tgt t on t.officer = e.created_by where e.expense_date = '2026-07-03' and e.status <> 'draft' on conflict (source_expense_id) do nothing;"

          echo "== AFTER: lines now in internal inputs dated Jul 3 =="
          run_sql "select count(*) as lines, coalesce(sum(amount),0) as total from public.client_financials where entry_date = '2026-07-03';"
