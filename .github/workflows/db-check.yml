name: DB Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VT: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: List Vercel teams and projects
        run: |
          set -e
          echo "=== teams ==="
          curl -s "https://api.vercel.com/v2/teams" -H "Authorization: Bearer $VT" > /tmp/teams.json
          jq -r '.teams[]? | [.id, .slug, .billing.plan] | @tsv' /tmp/teams.json
          echo "=== personal projects ==="
          curl -s "https://api.vercel.com/v9/projects" -H "Authorization: Bearer $VT" | jq -r '.projects[]? | .name'
          for TID in $(jq -r '.teams[]?.id' /tmp/teams.json); do
            echo "=== projects in team $TID ==="
            curl -s "https://api.vercel.com/v9/projects?teamId=$TID" -H "Authorization: Bearer $VT" | jq -r '.projects[]? | .name'
          done
