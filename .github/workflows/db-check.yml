name: DB Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Show subscription plan
        run: |
          set -e
          echo "=== organizations ==="
          curl -s https://api.supabase.com/v1/organizations -H "Authorization: Bearer $SAT" | jq -r '.[] | [.id, .name] | @tsv'
          for SLUG in $(curl -s https://api.supabase.com/v1/organizations -H "Authorization: Bearer $SAT" | jq -r '.[].id'); do
            echo "=== org $SLUG detail ==="
            curl -s "https://api.supabase.com/v1/organizations/$SLUG" -H "Authorization: Bearer $SAT" | jq '{name, plan, opt_in_tags}' 2>/dev/null || true
          done
          echo "=== projects ==="
          curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r '.[] | [.id, .name, .region, .status] | @tsv'
