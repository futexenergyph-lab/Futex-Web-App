name: DB Check

# Diagnostic: verify imported financial-report clients are owner-only.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Inspect
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          URL="https://$REF.supabase.co"
          APP="https://futex-web-app.vercel.app"
          SERVICE=$(curl -s "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[]|select(.name=="service_role")|.api_key) else empty end')
          ANON=$(curl -s "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[]|select(.name=="anon")|.api_key) else empty end')

          cnt() { curl -s -I -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -H "Prefer: count=exact" -H "Range: 0-0" "$URL/rest/v1/$1" | tr -d '\r' | grep -i content-range | awk -F/ '{print $2}'; }
          echo "internal_clients (service): $(cnt 'internal_clients?select=id')"
          echo "bookings still tagged     : $(cnt 'bookings?select=id&notes=ilike.*FINANCIAL_REPORT_MAY_2026*')"
          echo "total payments rows       : $(cnt 'payments?select=id')"
          echo "client_financials rows    : $(cnt 'client_financials?select=id')"

          probe() { # $1 role
            TS=$(date +%s%N); EMAIL="diag-$1-$TS@example.com"; PASS="Probe-$TS-Aa1!"
            CREATE=$(curl -s -X POST "$URL/auth/v1/admin/users" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\",\"email_confirm\":true}")
            PUID=$(echo "$CREATE" | jq -r '.id // .user.id // empty')
            curl -s -X POST "$URL/rest/v1/profiles" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" -d "{\"id\":\"$PUID\",\"full_name\":\"Diag $1\",\"role\":\"$1\",\"active\":true}" -o /dev/null
            TOK=$(curl -s -X POST "$URL/auth/v1/token?grant_type=password" -H "apikey: $ANON" -H "Content-Type: application/json" -d "{\"email\":\"$EMAIL\",\"password\":\"$PASS\"}")
            ACCESS=$(echo "$TOK" | jq -r '.access_token // empty')
            N=$(curl -s -H "apikey: $ANON" -H "Authorization: Bearer $ACCESS" "$URL/rest/v1/internal_clients?select=id" | jq 'length')
            F=$(curl -s -H "apikey: $ANON" -H "Authorization: Bearer $ACCESS" "$URL/rest/v1/client_financials?select=id&limit=5" | jq 'length')
            L=$(curl -s -H "apikey: $ANON" -H "Authorization: Bearer $ACCESS" "$URL/rest/v1/internal_inputs?select=id&limit=5" | jq 'length')
            B=$(curl -s -H "apikey: $ANON" -H "Authorization: Bearer $ACCESS" "$URL/rest/v1/bookings?select=id&notes=ilike.*FINANCIAL_REPORT_MAY_2026*" | jq 'length')
            echo "$1 role sees: internal_clients=$N client_financials=$F internal_inputs=$L tagged_bookings=$B"
            # Owner page check
            if [ "$1" = "owner" ]; then
              SESSION=$(echo "$TOK" | jq -c '.'); NAME="sb-$REF-auth-token"
              B64=$(printf '%s' "$SESSION" | base64 -w0 | tr '+/' '-_' | tr -d '='); VAL="base64-$B64"; LEN=${#VAL}
              CA=(); if [ $LEN -le 3600 ]; then CA=(-b "$NAME=$VAL"); else
                off=0; i=0; while [ $off -lt $LEN ]; do CA+=(-b "$NAME.$i=${VAL:$off:3600}"); off=$((off+3600)); i=$((i+1)); done; fi
              code=$(curl -s "${CA[@]}" -o /tmp/b -w '%{http_code}' -L "$APP/admin/internal-inputs/financial-report")
              echo "owner financial-report -> HTTP $code  'Katagumpay'=$(grep -c 'Katagumpay' /tmp/b)"
            fi
            if [ "$1" = "admin" ]; then
              SESSION=$(echo "$TOK" | jq -c '.'); NAME="sb-$REF-auth-token"
              B64=$(printf '%s' "$SESSION" | base64 -w0 | tr '+/' '-_' | tr -d '='); VAL="base64-$B64"; LEN=${#VAL}
              CA=(); if [ $LEN -le 3600 ]; then CA=(-b "$NAME=$VAL"); else
                off=0; i=0; while [ $off -lt $LEN ]; do CA+=(-b "$NAME.$i=${VAL:$off:3600}"); off=$((off+3600)); i=$((i+1)); done; fi
              code=$(curl -s "${CA[@]}" -o /tmp/b -w '%{http_code}' -L "$APP/admin/clients")
              echo "admin client masterlist -> HTTP $code  'Katagumpay'=$(grep -c 'Katagumpay' /tmp/b) (must be 0)"
            fi
            curl -s -X DELETE "$URL/auth/v1/admin/users/$PUID" -H "apikey: $SERVICE" -H "Authorization: Bearer $SERVICE" -o /dev/null
          }
          probe owner
          probe admin
          probe accounting
