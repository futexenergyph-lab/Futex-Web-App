name: DB Check

# One-off (owner request): clean slate for Internal Inputs Financial Report —
# remove ALL per-client expense lines and reopen every finalized client.
# Payments, job orders, accounting expenses and the internal ledger untouched.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Clean slate
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          echo "project ref: $REF"
          run_sql() {
            local RESP
            RESP=$(curl -s -w $'\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SAT" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$1" '{query:$q}')")
            echo "HTTP $(echo "$RESP" | tail -n1)"
            echo "$RESP" | sed '$d' | head -c 800; echo
          }

          echo "== BEFORE =="
          run_sql "select count(*) as expense_lines from public.client_financials;"
          run_sql "select count(*) as finalized_clients from public.client_financial_status where finalized_at is not null;"

          echo "== REMOVE ALL EXPENSE LINES + REOPEN ALL CLIENTS =="
          run_sql "delete from public.client_financials;"
          run_sql "update public.client_financial_status set finalized_at = null, finalized_by = null, finalized_by_name = null where finalized_at is not null;"

          echo "== AFTER =="
          run_sql "select count(*) as expense_lines from public.client_financials;"
          run_sql "select count(*) as finalized_clients from public.client_financial_status where finalized_at is not null;"
