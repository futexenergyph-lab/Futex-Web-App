name: DB Check

# Diagnostic: list available database backups + current July figures.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Inspect
        run: |
          set +e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          echo "project ref: $REF"
          run_sql() {
            local SQL="$1"
            local RESP
            RESP=$(curl -s -w $'\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SAT" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$SQL" '{query:$q}')")
            echo "HTTP $(echo "$RESP" | tail -n1)"
            echo "$RESP" | sed '$d' | head -c 2000; echo
          }

          echo "== Available backups =="
          curl -s "https://api.supabase.com/v1/projects/$REF/database/backups" -H "Authorization: Bearer $SAT" | head -c 3000; echo

          echo "== Current July 2026 figures (per current data) =="
          run_sql "with july_clients as (select id, client_name from public.bookings where preferred_date >= '2026-07-01' and preferred_date <= '2026-07-31' union select id, client_name from public.internal_clients where install_date >= '2026-07-01' and install_date <= '2026-07-31') select count(*) as clients from july_clients;"
          run_sql "with july_clients as (select id from public.bookings where preferred_date >= '2026-07-01' and preferred_date <= '2026-07-31' union select id from public.internal_clients where install_date >= '2026-07-01' and install_date <= '2026-07-31'), pay as (select coalesce(sum(amount),0) s from public.payments where booking_id in (select id from july_clients) and status = 'confirmed'), ipay as (select coalesce(sum(payment_amount),0) s from public.internal_clients where install_date >= '2026-07-01' and install_date <= '2026-07-31'), exp as (select coalesce(sum(amount),0) s from public.client_financials where booking_id in (select id from july_clients)) select (select s from pay) + (select s from ipay) as payments, (select s from exp) as expenses, (select s from pay) + (select s from ipay) - (select s from exp) as profit;"
