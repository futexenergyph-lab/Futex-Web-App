name: DB Migrate

# Applies pending schema changes directly via the Supabase Management API
# (works regardless of GitHub-integration sync timing). Idempotent.

on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SAT: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF_IN: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Apply pending schema changes
        run: |
          set -e
          REF="$REF_IN"
          if [ -z "$REF" ]; then
            REF=$(curl -s https://api.supabase.com/v1/projects -H "Authorization: Bearer $SAT" | jq -r 'if type=="array" then (.[0].id // empty) else empty end')
          fi
          echo "project ref: $REF"
          run_sql() {
            local SQL="$1"
            local RESP
            RESP=$(curl -s -w $'\n%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
              -H "Authorization: Bearer $SAT" -H "Content-Type: application/json" \
              -d "$(jq -nc --arg q "$SQL" '{query:$q}')")
            echo "HTTP $(echo "$RESP" | tail -n1)"
            echo "$RESP" | sed '$d' | head -c 600; echo
          }

          # Installer flow columns (idempotent)
          run_sql 'alter table public.bookings add column if not exists installer_confirmed_at timestamptz, add column if not exists installer_declined_at timestamptz, add column if not exists installation_done_at timestamptz;'

          # Expenses / payables table (idempotent)
          run_sql "create table if not exists public.expenses (id uuid primary key default gen_random_uuid(), expense_date date not null default current_date, type text not null default 'others', description text, amount numeric(12,2) not null check (amount >= 0), created_by uuid references public.profiles(id) on delete set null, created_at timestamptz not null default now(), updated_at timestamptz not null default now());"
          run_sql 'create index if not exists idx_expenses_date on public.expenses(expense_date); create index if not exists idx_expenses_type on public.expenses(type);'
          run_sql 'alter table public.expenses enable row level security;'
          run_sql 'drop policy if exists expenses_all on public.expenses; create policy expenses_all on public.expenses for all using (public.is_admin() or public.is_accounting()) with check (public.is_admin() or public.is_accounting());'

          # Pricing images (idempotent)
          run_sql 'alter table public.packages add column if not exists image_url text; alter table public.enclosures add column if not exists image_url text; alter table public.addons add column if not exists image_url text;'
          run_sql "insert into storage.buckets (id, name, public) values ('pricing','pricing',true) on conflict (id) do nothing;"
          run_sql 'drop policy if exists "pricing insert admin" on storage.objects; create policy "pricing insert admin" on storage.objects for insert to authenticated with check (bucket_id = '"'"'pricing'"'"' and public.is_admin());'
          run_sql 'drop policy if exists "pricing update admin" on storage.objects; create policy "pricing update admin" on storage.objects for update to authenticated using (bucket_id = '"'"'pricing'"'"' and public.is_admin());'
          run_sql 'drop policy if exists "pricing read public" on storage.objects; create policy "pricing read public" on storage.objects for select using (bucket_id = '"'"'pricing'"'"');'

          # Job order change requests (idempotent)
          run_sql 'alter table public.job_orders add column if not exists change_requested_at timestamptz, add column if not exists change_request_reason text, add column if not exists change_approved_at timestamptz, add column if not exists change_approved_by uuid references public.profiles(id) on delete set null;'
          run_sql 'create index if not exists idx_job_orders_change_pending on public.job_orders(booking_id) where change_requested_at is not null and change_approved_at is null;'

          # Declined booking status (idempotent)
          run_sql "alter type public.booking_status add value if not exists 'declined';"

          # Owner + HR roles (each enum add is its own txn so it commits before use)
          run_sql "alter type public.user_role add value if not exists 'owner';"
          run_sql "alter type public.user_role add value if not exists 'hr';"
          run_sql "create or replace function public.is_admin() returns boolean language sql stable security definer set search_path = public as \$\$ select exists (select 1 from public.profiles where id = auth.uid() and role in ('admin','owner') and active); \$\$;"
          run_sql "create or replace function public.is_hr() returns boolean language sql stable security definer set search_path = public as \$\$ select exists (select 1 from public.profiles where id = auth.uid() and role = 'hr' and active); \$\$;"
          run_sql 'drop policy if exists profiles_select on public.profiles; create policy profiles_select on public.profiles for select using (id = auth.uid() or public.is_admin() or public.is_accounting() or public.is_hr());'
          run_sql 'drop policy if exists attendance_select on public.attendance; create policy attendance_select on public.attendance for select using (user_id = auth.uid() or public.is_admin() or public.is_accounting() or public.is_hr());'
          run_sql 'drop policy if exists "attendance read own or staff" on storage.objects; create policy "attendance read own or staff" on storage.objects for select to authenticated using (bucket_id = '"'"'attendance'"'"' and ((storage.foldername(name))[1] = auth.uid()::text or public.is_admin() or public.is_accounting() or public.is_hr()));'

          # User removal requests (owner-approval workflow)
          run_sql 'alter table public.profiles add column if not exists deletion_requested_at timestamptz, add column if not exists deletion_requested_by uuid references public.profiles(id) on delete set null;'

          # Employee 201 files (private bucket; HR + admin manage)
          run_sql "insert into storage.buckets (id, name, public) values ('employee-201','employee-201',false) on conflict (id) do nothing;"
          run_sql 'drop policy if exists "201 read hr or admin" on storage.objects; create policy "201 read hr or admin" on storage.objects for select to authenticated using (bucket_id = '"'"'employee-201'"'"' and (public.is_hr() or public.is_admin()));'
          run_sql 'drop policy if exists "201 insert hr or admin" on storage.objects; create policy "201 insert hr or admin" on storage.objects for insert to authenticated with check (bucket_id = '"'"'employee-201'"'"' and (public.is_hr() or public.is_admin()));'
          run_sql 'drop policy if exists "201 delete hr or admin" on storage.objects; create policy "201 delete hr or admin" on storage.objects for delete to authenticated using (bucket_id = '"'"'employee-201'"'"' and (public.is_hr() or public.is_admin()));'

          # Booking email + client number
          run_sql 'alter table public.bookings add column if not exists email text, add column if not exists client_number text;'

          # Limited "Admin" role (enum add first, then is_admin includes it)
          run_sql "alter type public.user_role add value if not exists 'admin_staff';"
          run_sql "create or replace function public.is_admin() returns boolean language sql stable security definer set search_path = public as \$\$ select exists (select 1 from public.profiles where id = auth.uid() and role in ('admin','owner','admin_staff') and active); \$\$;"

          # Job order client signature
          run_sql 'alter table public.job_orders add column if not exists signature text;'

          # Booking documents (commissioning PDFs) + storage bucket
          run_sql 'create table if not exists public.booking_documents (id uuid primary key default gen_random_uuid(), booking_id uuid not null references public.bookings(id) on delete cascade, kind text not null default '"'"'commissioning'"'"', title text not null, storage_path text not null, data jsonb, created_by uuid references public.profiles(id) on delete set null, created_at timestamptz not null default now());'
          run_sql 'create index if not exists idx_booking_documents_booking on public.booking_documents(booking_id);'
          run_sql 'alter table public.booking_documents enable row level security;'
          run_sql 'drop policy if exists booking_documents_select on public.booking_documents; create policy booking_documents_select on public.booking_documents for select using (public.is_admin() or public.is_accounting() or created_by = auth.uid() or public.is_assigned_to_booking(booking_id));'
          run_sql 'drop policy if exists booking_documents_insert on public.booking_documents; create policy booking_documents_insert on public.booking_documents for insert with check (public.is_admin() or (created_by = auth.uid() and public.is_assigned_to_booking(booking_id)));'
          run_sql 'drop policy if exists booking_documents_delete on public.booking_documents; create policy booking_documents_delete on public.booking_documents for delete using (public.is_admin() or created_by = auth.uid());'
          run_sql "insert into storage.buckets (id, name, public) values ('documents','documents',false) on conflict (id) do nothing;"
          run_sql 'drop policy if exists "documents insert staff" on storage.objects; create policy "documents insert staff" on storage.objects for insert to authenticated with check (bucket_id = '"'"'documents'"'"');'
          run_sql 'drop policy if exists "documents read own or admin" on storage.objects; create policy "documents read own or admin" on storage.objects for select to authenticated using (bucket_id = '"'"'documents'"'"' and (owner = auth.uid() or public.is_admin() or public.is_accounting()));'

          # Back job orders (after-sales support tickets)
          run_sql 'alter table public.bookings add column if not exists is_back_job_order boolean not null default false, add column if not exists parent_booking_id uuid references public.bookings(id) on delete set null, add column if not exists back_job_field_note text;'
          run_sql 'create index if not exists idx_bookings_back_job on public.bookings(is_back_job_order) where is_back_job_order;'

          # Audit logs (management/owner edits & deletes, with redo/restore)
          run_sql 'create table if not exists public.audit_logs (id uuid primary key default gen_random_uuid(), table_name text not null, record_id uuid not null, action text not null, label text, before_data jsonb, after_data jsonb, actor_id uuid references public.profiles(id) on delete set null, actor_name text, undone_at timestamptz, created_at timestamptz not null default now());'
          run_sql 'create index if not exists idx_audit_logs_created on public.audit_logs(created_at desc);'
          run_sql 'alter table public.audit_logs enable row level security;'
          run_sql 'drop policy if exists audit_logs_select on public.audit_logs; create policy audit_logs_select on public.audit_logs for select using (public.is_admin());'
          run_sql 'drop policy if exists audit_logs_insert on public.audit_logs; create policy audit_logs_insert on public.audit_logs for insert with check (public.is_admin());'
          run_sql 'drop policy if exists audit_logs_update on public.audit_logs; create policy audit_logs_update on public.audit_logs for update using (public.is_admin()) with check (public.is_admin());'

          # Field officers may record their own expenses
          run_sql 'drop policy if exists expenses_insert_own on public.expenses; create policy expenses_insert_own on public.expenses for insert with check (created_by = auth.uid());'
          run_sql 'drop policy if exists expenses_select_own on public.expenses; create policy expenses_select_own on public.expenses for select using (created_by = auth.uid());'
          run_sql 'drop policy if exists expenses_delete_own on public.expenses; create policy expenses_delete_own on public.expenses for delete using (created_by = auth.uid());'

          # Expense approval workflow (field officer -> admin -> accounting)
          run_sql "alter table public.expenses add column if not exists status text not null default 'finalized', add column if not exists booking_id uuid references public.bookings(id) on delete set null;"
          run_sql "drop policy if exists expenses_update_own on public.expenses; create policy expenses_update_own on public.expenses for update using (created_by = auth.uid() and status = 'draft') with check (created_by = auth.uid());"

          # Personal Data Sheet (PDS) — surfaced in 201 files
          run_sql 'create table if not exists public.personal_data_sheets (id uuid primary key default gen_random_uuid(), user_id uuid not null unique references public.profiles(id) on delete cascade, photo_url text, data jsonb not null default '"'"'{}'"'"'::jsonb, created_at timestamptz not null default now(), updated_at timestamptz not null default now());'
          run_sql 'alter table public.personal_data_sheets enable row level security;'
          run_sql 'drop policy if exists pds_select on public.personal_data_sheets; create policy pds_select on public.personal_data_sheets for select using (user_id = auth.uid() or public.is_hr() or public.is_admin());'
          run_sql 'drop policy if exists pds_insert on public.personal_data_sheets; create policy pds_insert on public.personal_data_sheets for insert with check (user_id = auth.uid());'
          run_sql 'drop policy if exists pds_update on public.personal_data_sheets; create policy pds_update on public.personal_data_sheets for update using (user_id = auth.uid()) with check (user_id = auth.uid());'

          # HR/Management/Owner may maintain any employee's PDS + photo
          run_sql 'drop policy if exists pds_insert on public.personal_data_sheets; create policy pds_insert on public.personal_data_sheets for insert with check (user_id = auth.uid() or public.is_hr() or public.is_admin());'
          run_sql 'drop policy if exists pds_update on public.personal_data_sheets; create policy pds_update on public.personal_data_sheets for update using (user_id = auth.uid() or public.is_hr() or public.is_admin()) with check (user_id = auth.uid() or public.is_hr() or public.is_admin());'
          run_sql 'drop policy if exists "profiles insert hr admin" on storage.objects; create policy "profiles insert hr admin" on storage.objects for insert to authenticated with check (bucket_id = '"'"'profiles'"'"' and (public.is_hr() or public.is_admin()));'
          run_sql 'drop policy if exists "profiles update hr admin" on storage.objects; create policy "profiles update hr admin" on storage.objects for update to authenticated using (bucket_id = '"'"'profiles'"'"' and (public.is_hr() or public.is_admin()));'

          # Per-actor deployment status (field officer vs installer)
          run_sql 'alter table public.bookings add column if not exists field_officer_arrived_at timestamptz, add column if not exists installer_arrived_at timestamptz, add column if not exists installer_done_at timestamptz;'

          # Decline a field-recorded payment (lets the officer resubmit)
          run_sql "alter type public.payment_status add value if not exists 'declined';"

          # Expense submission batches (group + total per submission)
          run_sql 'alter table public.expenses add column if not exists submission_id uuid, add column if not exists submitted_at timestamptz;'
          run_sql 'create index if not exists idx_expenses_submission on public.expenses(submission_id);'

          # Backfill installer_done_at for jobs installers completed before the
          # per-actor done split, so every installer's Client Master List shows
          # their past completed installations.
          run_sql 'update public.bookings set installer_done_at = installation_done_at where installer_done_at is null and installation_done_at is not null and assigned_installer_id is not null;'

          # Announcements (broadcast messages + per-user read receipts)
          run_sql "create table if not exists public.announcements (id uuid primary key default gen_random_uuid(), message text not null, audience text not null default 'all', created_by uuid references public.profiles(id) on delete set null, created_by_name text, created_at timestamptz not null default now());"
          run_sql 'create index if not exists idx_announcements_created on public.announcements(created_at desc);'
          run_sql 'create table if not exists public.announcement_targets (announcement_id uuid not null references public.announcements(id) on delete cascade, user_id uuid not null references public.profiles(id) on delete cascade, primary key (announcement_id, user_id));'
          run_sql 'create table if not exists public.announcement_reads (announcement_id uuid not null references public.announcements(id) on delete cascade, user_id uuid not null references public.profiles(id) on delete cascade, read_at timestamptz not null default now(), primary key (announcement_id, user_id));'
          run_sql 'alter table public.announcements enable row level security; alter table public.announcement_targets enable row level security; alter table public.announcement_reads enable row level security;'
          run_sql "drop policy if exists announcements_select on public.announcements; create policy announcements_select on public.announcements for select using (public.is_admin() or audience = 'all' or exists (select 1 from public.announcement_targets t where t.announcement_id = id and t.user_id = auth.uid()));"
          run_sql 'drop policy if exists announcements_insert on public.announcements; create policy announcements_insert on public.announcements for insert with check (public.is_admin());'
          run_sql 'drop policy if exists announcements_delete on public.announcements; create policy announcements_delete on public.announcements for delete using (public.is_admin());'
          run_sql 'drop policy if exists announcement_targets_select on public.announcement_targets; create policy announcement_targets_select on public.announcement_targets for select using (public.is_admin() or user_id = auth.uid());'
          run_sql 'drop policy if exists announcement_targets_insert on public.announcement_targets; create policy announcement_targets_insert on public.announcement_targets for insert with check (public.is_admin());'
          run_sql 'drop policy if exists announcement_reads_select on public.announcement_reads; create policy announcement_reads_select on public.announcement_reads for select using (public.is_admin() or user_id = auth.uid());'
          run_sql 'drop policy if exists announcement_reads_insert on public.announcement_reads; create policy announcement_reads_insert on public.announcement_reads for insert with check (user_id = auth.uid());'

          # Quotations (EV Charger / Solar Solution) + private PDF bucket
          run_sql "create table if not exists public.quotations (id uuid primary key default gen_random_uuid(), quote_no text, type text not null default 'ev', client_name text not null, client_address text, client_contact text, client_email text, items jsonb not null default '[]', subtotal numeric(12,2) not null default 0, vat_enabled boolean not null default false, vat numeric(12,2) not null default 0, total numeric(12,2) not null default 0, validity_days integer not null default 30, notes text, storage_path text, prepared_by uuid references public.profiles(id) on delete set null, prepared_by_name text, created_at timestamptz not null default now());"
          run_sql 'create index if not exists idx_quotations_created on public.quotations(created_at desc);'
          run_sql 'alter table public.quotations enable row level security;'
          run_sql 'drop policy if exists quotations_all on public.quotations; create policy quotations_all on public.quotations for all using (public.is_admin()) with check (public.is_admin());'
          run_sql "insert into storage.buckets (id, name, public) values ('quotations','quotations',false) on conflict (id) do nothing;"
          run_sql 'drop policy if exists "quotations insert admin" on storage.objects; create policy "quotations insert admin" on storage.objects for insert to authenticated with check (bucket_id = '"'"'quotations'"'"' and public.is_admin());'
          run_sql 'drop policy if exists "quotations read admin" on storage.objects; create policy "quotations read admin" on storage.objects for select to authenticated using (bucket_id = '"'"'quotations'"'"' and public.is_admin());'
          run_sql 'drop policy if exists "quotations delete admin" on storage.objects; create policy "quotations delete admin" on storage.objects for delete to authenticated using (bucket_id = '"'"'quotations'"'"' and public.is_admin());'
          # Structured solar quotation payload (proposed cost + product detail)
          run_sql 'alter table public.quotations add column if not exists details jsonb;'

          # Retail purchases (over-the-counter retail orders -> profit)
          run_sql "create table if not exists public.retail_purchases (id uuid primary key default gen_random_uuid(), purchase_date date not null default current_date, type text not null default 'others', description text, amount numeric(12,2) not null check (amount >= 0), status text not null default 'recorded', created_by uuid references public.profiles(id) on delete set null, created_by_name text, submitted_at timestamptz, created_at timestamptz not null default now());"
          run_sql 'create index if not exists idx_retail_purchases_date on public.retail_purchases(purchase_date); create index if not exists idx_retail_purchases_status on public.retail_purchases(status);'
          run_sql 'alter table public.retail_purchases enable row level security;'
          run_sql 'drop policy if exists retail_purchases_all on public.retail_purchases; create policy retail_purchases_all on public.retail_purchases for all using (public.is_admin() or public.is_accounting()) with check (public.is_admin() or public.is_accounting());'

          # Split payments (multiple methods for one payment)
          run_sql 'alter table public.payments add column if not exists splits jsonb;'

          # Internal Inputs (Owner-only ledger of internal cash & costs)
          run_sql "create or replace function public.is_owner() returns boolean language sql stable security definer set search_path = public as \$\$ select exists (select 1 from public.profiles where id = auth.uid() and role = 'owner' and active); \$\$;"
          run_sql "create table if not exists public.internal_inputs (id uuid primary key default gen_random_uuid(), entry_date date not null default current_date, direction text not null default 'out', category text not null default 'Other', description text not null default '', amount numeric(14,2) not null default 0, payee text, reference_no text, notes text, attachment_path text, created_by uuid references public.profiles(id) on delete set null, created_by_name text, created_at timestamptz not null default now(), updated_at timestamptz not null default now());"
          run_sql 'create index if not exists idx_internal_inputs_date on public.internal_inputs(entry_date desc);'
          run_sql 'alter table public.internal_inputs enable row level security;'
          run_sql 'drop policy if exists internal_inputs_select on public.internal_inputs; create policy internal_inputs_select on public.internal_inputs for select using (public.is_owner());'
          run_sql 'drop policy if exists internal_inputs_insert on public.internal_inputs; create policy internal_inputs_insert on public.internal_inputs for insert with check (public.is_owner());'
          run_sql 'drop policy if exists internal_inputs_update on public.internal_inputs; create policy internal_inputs_update on public.internal_inputs for update using (public.is_owner()) with check (public.is_owner());'
          run_sql 'drop policy if exists internal_inputs_delete on public.internal_inputs; create policy internal_inputs_delete on public.internal_inputs for delete using (public.is_owner());'
          run_sql "insert into storage.buckets (id, name, public) values ('internal-inputs','internal-inputs',false) on conflict (id) do nothing;"
          run_sql 'drop policy if exists "internal inputs objects owner" on storage.objects; create policy "internal inputs objects owner" on storage.objects for all to authenticated using (bucket_id = '"'"'internal-inputs'"'"' and public.is_owner()) with check (bucket_id = '"'"'internal-inputs'"'"' and public.is_owner());'

          # Client financials (Owner-only project-based expense tracking)
          run_sql "create table if not exists public.client_financials (id uuid primary key default gen_random_uuid(), booking_id uuid not null references public.bookings(id) on delete cascade, entry_date date, project_name text, expense_type text not null default 'Materials', description text not null default '', amount numeric(14,2) not null default 0, charge_to text, remarks text, created_by uuid references public.profiles(id) on delete set null, created_by_name text, created_at timestamptz not null default now(), updated_at timestamptz not null default now());"
          run_sql 'create index if not exists idx_client_financials_booking on public.client_financials(booking_id);'
          run_sql 'alter table public.client_financials enable row level security;'
          run_sql 'drop policy if exists client_financials_select on public.client_financials; create policy client_financials_select on public.client_financials for select using (public.is_owner());'
          run_sql 'drop policy if exists client_financials_insert on public.client_financials; create policy client_financials_insert on public.client_financials for insert with check (public.is_owner());'
          run_sql 'drop policy if exists client_financials_update on public.client_financials; create policy client_financials_update on public.client_financials for update using (public.is_owner()) with check (public.is_owner());'
          run_sql 'drop policy if exists client_financials_delete on public.client_financials; create policy client_financials_delete on public.client_financials for delete using (public.is_owner());'

          # Client financial report final-submission marker (Owner-only)
          run_sql "create table if not exists public.client_financial_status (booking_id uuid primary key references public.bookings(id) on delete cascade, finalized_at timestamptz, finalized_by uuid references public.profiles(id) on delete set null, finalized_by_name text, updated_at timestamptz not null default now());"
          run_sql 'alter table public.client_financial_status enable row level security;'
          run_sql 'drop policy if exists client_financial_status_select on public.client_financial_status; create policy client_financial_status_select on public.client_financial_status for select using (public.is_owner());'
          run_sql 'drop policy if exists client_financial_status_insert on public.client_financial_status; create policy client_financial_status_insert on public.client_financial_status for insert with check (public.is_owner());'
          run_sql 'drop policy if exists client_financial_status_update on public.client_financial_status; create policy client_financial_status_update on public.client_financial_status for update using (public.is_owner()) with check (public.is_owner());'
          run_sql 'drop policy if exists client_financial_status_delete on public.client_financial_status; create policy client_financial_status_delete on public.client_financial_status for delete using (public.is_owner());'

          echo "Done."
